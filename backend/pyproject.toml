[project]
name = "nfl-fantasy-viz-backend"
version = "0.1.0"
description = "API backend for NFL Fantasy Visualization"
authors = [
    { name = "Caleb Johnson", email = "calebzjohnson@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "nflreadpy>=0.1.5",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pandas-stubs>=2.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "nflreadpy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
