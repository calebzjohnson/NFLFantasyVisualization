name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: a compromised step can't push to main (which Vercel and
# Render deploy from) or otherwise change the repo.
permissions:
  contents: read

# Actions are pinned to commit SHAs (tags can be moved to other code); the
# trailing comment is the release each SHA was taken from.
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.15"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Production builds require it (vite.config.ts). CI only checks that
          # the build succeeds; the real URL is set in Vercel.
          VITE_API_BASE_URL: https://api.example.invalid
